<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертус · Konvertus</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://konvertus.github.io/konvertus/ru/">
    <link rel="alternate" hreflang="ru" href="https://konvertus.github.io/konvertus/ru/index.html">
    <link rel="alternate" hreflang="en" href="https://konvertus.github.io/konvertus/en/index.html">
    <link rel="alternate" hreflang="x-default" href="https://konvertus.github.io/konvertus/ru/index.html">
    <noscript><meta http-equiv="refresh" content="0; url=ru/index.html"></noscript>
    <script>
        // Выбор языка по настройкам браузера: русский и близкие языки — русская версия, остальные — английская
        (function () {
            var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "ru"];
            var ru = /^(ru|be|uk|kk)\b/i;
            var target = langs.some(function (l) { return ru.test(l); }) ? "ru/index.html" : "en/index.html";
            location.replace(target + location.hash);
        })();
    </script>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin: 20vh 1rem 0; color: #333; }
        a { color: #5c7059; margin: 0 .5rem; font-size: 1.2rem; }
    </style>
</head>
<body>
    <p><a href="ru/index.html" hreflang="ru" lang="ru">Русский</a> · <a href="en/index.html" hreflang="en" lang="en">English</a></p>
</body>
</html>
