name: Обновление курсов банков

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать курсы банков
        run: python3 tools/update_banks.py

      - name: Сохранить изменения
        run: |
          if [ -z "$(git status --porcelain data/banks.json)" ]; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/banks.json
          git commit -m "Обновление курсов банков"
          git pull --rebase
          git push
